items:
  - { name: "browserhttp", kind: "client", desc: "Pure-Go <code>http.Client</code> presenting a Chrome TLS fingerprint via uTLS. CGO=0." }
  - { name: "gitcorsproxy", kind: "proxy", desc: "A CORS reverse proxy for git smart-HTTP, so a Go/wasm git client in a browser can reach remotes that speak the protocol correctly and send no <code>Access-Control-Allow-Origin</code> — GitHub, a bare Forgejo. It forwards the git bytes both ways and adds the headers, scoped to an explicit origin list. It stores nothing: the browser holds the user's token and sends it per request, the proxy relays it and forgets it. Standard library only, CGO=0, SSRF-guarded. Since v0.4.0 an authenticated response is <code>Cache-Control: private, no-store</code> with <code>Vary: Authorization</code>, and the Authorization header is never logged (query included) nor followed through a redirect. Since v0.5.0 the connection goes to the IP the SSRF guard checked (no DNS rebinding), <code>-trusted-hops</code> defaults to 0 when the proxy serves TLS itself, a refused host is never logged with its userinfo, and the route parser is fuzzed and refuses dot segments. The operator of a proxy can read every token through it: prefer a forge REST API (browsergit) or a proxy you run yourself." }
  - { name: "browsergit", kind: "library", desc: "The git layer shared by the go-tex, go-slides and notebook playgrounds: load a project from GitHub, GitLab or Gitea/Forgejo and propose changes back as a new branch plus a pull request. Pure Go, runs in the browser (js/wasm). Packages <code>remote</code>, <code>forge</code>, <code>secret</code>, <code>browsergit</code> and <code>gitrpc</code>. The token is never printed, serialised, redirected or echoed; paths and links are validated; it never writes an existing, loaded or default branch. Since v0.4.0 the package <code>gitd</code> is a <code>Remote</code> over slides-gitd, the self-hosted backend a playground is served behind: the page holds no forge credential, talks to its own origin only (same-origin Fetch, HttpOnly session cookie, per-session CSRF token kept in memory), the server names the proposal's branch, and its answers are validated as hostile input and fuzzed. Released v0.4.0." }
